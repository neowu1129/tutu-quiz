<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测评管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","HarmonyOS Sans SC",-apple-system,sans-serif;background:#FFF8E7;color:#3D2817;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}
:root{--orange:#FF7A45;--orange-light:#FF9F66;--yellow:#FFC93C;--cream:#FFF8E7;--cream-deep:#FCEFD5;--red:#E84855;--green:#7BC4A4;--green-deep:#4A9B6E;--brown:#3D2817;--brown-light:#5D3A1A;--shadow:0 4px 16px rgba(255,122,69,.12);--shadow-hover:0 8px 24px rgba(255,122,69,.25)}

/* ===== 管理端头部 ===== */
.admin-header{position:sticky;top:0;z-index:50;background:rgba(255,248,231,.95);backdrop-filter:blur(8px);padding:16px 20px;border-bottom:1px solid var(--cream-deep)}
.admin-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.admin-title{font-size:22px;font-weight:800;color:var(--brown)}
.admin-header-actions{display:flex;align-items:center;gap:8px}
.admin-search{display:flex;align-items:center;gap:8px;background:white;border:2px solid var(--cream-deep);border-radius:14px;padding:8px 14px;flex:1;max-width:300px;transition:all .2s}
.admin-search:focus-within{border-color:var(--orange)}
.admin-search input{border:none;outline:none;font-size:15px;flex:1;background:transparent}
.admin-search-icon{font-size:18px;color:#8B8680}
.icon-btn{width:40px;height:40px;border-radius:12px;background:white;border:2px solid var(--cream-deep);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
.icon-btn:hover{border-color:var(--orange);background:#FFF0E8}

.admin-tabs{display:flex;gap:8px;max-width:960px;margin:16px auto 0;padding:0 20px}
.admin-tab{padding:8px 18px;border-radius:100px;font-size:14px;font-weight:700;color:#8B8680;background:var(--cream-deep);transition:all .2s}
.admin-tab.active{background:var(--orange);color:white}

/* ===== 远程状态栏 ===== */
.remote-bar{max-width:960px;margin:12px auto 0;padding:0 20px}
.remote-bar-inner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600}
.remote-bar-inner.connected{background:#E8F5EC;color:var(--green-deep)}
.remote-bar-inner.disconnected{background:#FCE8EA;color:var(--red)}
.remote-bar-inner .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.remote-bar-inner.connected .dot{background:var(--green)}
.remote-bar-inner.disconnected .dot{background:var(--red)}
.remote-bar-actions{margin-left:auto;display:flex;gap:8px}
.remote-bar-btn{padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700;transition:all .2s;cursor:pointer}
.remote-bar-btn.link{background:var(--orange);color:white}
.remote-bar-btn.link:hover{opacity:.85}
.remote-bar-btn.refresh{background:white;color:var(--brown);border:1px solid var(--cream-deep)}
.remote-bar-btn.refresh:hover{border-color:var(--orange)}

/* ===== 设置面板 ===== */
.setup-panel{max-width:960px;margin:16px auto 0;padding:0 20px}
.setup-card{background:white;border-radius:24px;padding:28px 24px;box-shadow:var(--shadow)}
.setup-card h3{font-size:20px;font-weight:800;color:var(--brown);margin-bottom:6px}
.setup-card .setup-desc{font-size:14px;color:#8B8680;margin-bottom:20px;line-height:1.7}
.setup-field{margin-bottom:16px}
.setup-field label{display:block;font-size:14px;font-weight:700;color:var(--brown);margin-bottom:6px}
.setup-field input{width:100%;border:2px solid var(--cream-deep);border-radius:14px;padding:12px 16px;font-size:15px;outline:none;background:var(--cream);transition:all .2s}
.setup-field input:focus{border-color:var(--orange);background:white}
.setup-field .field-hint{font-size:12px;color:#8B8680;margin-top:4px;line-height:1.5}
.setup-field .field-hint a{color:var(--orange);text-decoration:none;font-weight:600}
.setup-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.setup-btn{padding:12px 24px;border-radius:14px;font-size:15px;font-weight:700;transition:all .2s}
.setup-btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;box-shadow:var(--shadow)}
.setup-btn.primary:hover{transform:translateY(-1px)}
.setup-btn.secondary{background:var(--cream-deep);color:var(--brown)}
.setup-btn.secondary:hover{background:var(--cream)}
.setup-steps{background:var(--cream);border-radius:16px;padding:18px 20px;margin-bottom:20px}
.setup-steps h4{font-size:15px;font-weight:700;color:var(--orange);margin-bottom:10px}
.setup-steps ol{font-size:14px;color:var(--brown);line-height:1.8;padding-left:20px}
.setup-steps ol li{margin-bottom:4px}
.setup-steps ol a{color:var(--orange);text-decoration:none;font-weight:600}

/* ===== 管理端内容 ===== */
.admin-body{max-width:960px;margin:0 auto;padding:16px 20px}
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.admin-stat-card{background:white;border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.admin-stat-num{font-size:28px;font-weight:800;color:var(--orange)}
.admin-stat-label{font-size:12px;color:#8B8680;margin-top:2px}

.student-list{display:flex;flex-direction:column;gap:10px}
.student-row{background:white;border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.student-row:hover{border-color:var(--orange);transform:translateY(-1px)}
.student-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--yellow));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:18px;flex-shrink:0}
.student-info{flex:1;min-width:0}
.student-name{font-size:17px;font-weight:700;color:var(--brown)}
.student-meta{font-size:13px;color:#8B8680}
.student-correct{font-size:18px;font-weight:800;color:var(--orange)}
.student-time{font-size:12px;color:#8B8680}
.empty-state{text-align:center;padding:60px 20px;color:#8B8680}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:16px}
.loading-state{text-align:center;padding:40px 20px;color:#8B8680}
.loading-state .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--cream-deep);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 管理端-学生详情 */
.admin-detail-back{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--orange);margin-bottom:16px;cursor:pointer}
.admin-detail-back:hover{opacity:.7}
.admin-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.admin-detail-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--yellow));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:22px;flex-shrink:0}
.admin-detail-info h2{font-size:22px;font-weight:800;color:var(--brown)}
.admin-detail-info p{font-size:14px;color:#8B8680}
.admin-download-btn{margin-left:auto;padding:10px 20px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border-radius:14px;font-size:14px;font-weight:700;transition:all .2s;flex-shrink:0}
.admin-download-btn:hover{transform:translateY(-1px)}

/* 链接弹窗 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:white;border-radius:24px;padding:28px 24px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:scaleIn .3s ease}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{font-size:20px;font-weight:800;color:var(--brown);margin-bottom:6px}
.modal-card .modal-desc{font-size:14px;color:#8B8680;margin-bottom:16px}
.modal-link-box{display:flex;gap:8px;align-items:stretch}
.modal-link-input{flex:1;border:2px solid var(--cream-deep);border-radius:14px;padding:12px 14px;font-size:13px;outline:none;background:var(--cream);resize:none;min-height:80px;line-height:1.5;word-break:break-all}
.modal-copy-btn{padding:12px 20px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border-radius:14px;font-size:14px;font-weight:700;transition:all .2s;white-space:nowrap;align-self:flex-end}
.modal-copy-btn:hover{transform:translateY(-1px)}
.modal-close{margin-top:16px;width:100%;padding:12px;border-radius:14px;font-size:15px;font-weight:700;background:var(--cream-deep);color:var(--brown);transition:all .2s}
.modal-close:hover{background:var(--cream)}

/* 结果页样式 */
.radar-wrap{background:white;border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.radar-wrap h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.radar-subtitle{font-size:13px;color:#8B8680;margin-bottom:12px;padding-left:2px}
.radar-canvas-wrap{display:flex;justify-content:center}
canvas.radar-chart{max-width:360px;max-height:360px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:white;border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--orange)}
.stat-label{font-size:12px;color:#8B8680;margin-top:2px}
.time-bar-wrap{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.time-bar-wrap h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.time-bar-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.time-bar-label{width:60px;font-size:13px;font-weight:600;color:var(--brown);flex-shrink:0;text-align:right}
.time-bar-track{flex:1;height:16px;background:var(--cream-deep);border-radius:100px;overflow:hidden}
.time-bar-fill{height:100%;border-radius:100px;transition:width 1s ease;font-size:10px;font-weight:700;color:white;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:24px}
.time-bar-fill.fast{background:linear-gradient(90deg,var(--green),#5DD4A0)}
.time-bar-fill.normal{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.time-bar-fill.slow{background:linear-gradient(90deg,var(--red),#F06868)}
.time-bar-limit{font-size:11px;color:#8B8680;width:30px;text-align:left}
.detail-section{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.detail-section h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.detail-item{padding:12px 0;border-bottom:1px solid var(--cream-deep);display:flex;gap:12px;align-items:flex-start}
.detail-item:last-child{border-bottom:none}
.detail-body{flex:1;min-width:0}
.detail-q{font-size:15px;font-weight:600;color:var(--brown);margin-bottom:4px}
.detail-meta{font-size:13px;color:#8B8680;display:flex;gap:10px;flex-wrap:wrap}
.detail-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.detail-tag.concept{background:#FFF4D6;color:#B88600}
.detail-tag.trap{background:#FCE8EA;color:var(--red)}
.diag-section{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.diag-section h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.diag-bar-list{display:flex;flex-direction:column;gap:10px}
.diag-bar-item{display:flex;align-items:center;gap:10px}
.diag-bar-label{width:100px;font-size:14px;font-weight:600;color:var(--brown);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diag-bar-track{flex:1;height:20px;background:var(--cream-deep);border-radius:100px;overflow:hidden;position:relative}
.diag-bar-fill{height:100%;border-radius:100px;transition:width 1s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;font-weight:700;color:white;min-width:28px}
.diag-bar-fill.high{background:linear-gradient(90deg,var(--green),#5DD4A0)}
.diag-bar-fill.mid{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.diag-bar-fill.low{background:linear-gradient(90deg,var(--red),#F06868)}

/* 深度分析模块 */
.analysis-card{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.analysis-card h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.analysis-item{padding:12px 14px;background:var(--cream);border-radius:14px;margin-bottom:10px;font-size:14px;color:var(--brown);line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.analysis-item:last-child{margin-bottom:0}
.analysis-item .a-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.analysis-item .a-text{flex:1}
.copy-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;background:var(--cream-deep);border-radius:100px;font-size:12px;font-weight:700;color:var(--brown);cursor:pointer;transition:all .2s;border:none;margin-top:10px}
.copy-btn:hover{background:var(--orange);color:white}
.copy-btn.copied{background:var(--green);color:white}

.course-card{background:linear-gradient(135deg,#FFF0E8,#FFF8E7);border-radius:24px;padding:24px;margin-bottom:16px;border:2px solid var(--cream-deep)}
.course-card h3{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.course-card.subtle h3{color:var(--brown)}
.course-card.direct h3{color:var(--orange)}
.course-text{font-size:15px;color:var(--brown);line-height:1.8;padding:14px;background:white;border-radius:14px;margin-bottom:10px}

.result-header{text-align:center;padding:24px 0 16px}
.result-header h1{font-size:24px;font-weight:800;color:var(--brown)}
.result-header p{font-size:15px;color:#8B8680;margin-top:4px}

@media(max-width:600px){
  .admin-stats{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .admin-header-inner{flex-wrap:wrap}
  .admin-search{max-width:100%;order:2;width:100%}
  .admin-detail-header{flex-direction:column;align-items:flex-start}
  .admin-download-btn{margin-left:0}
  .modal-link-box{flex-direction:column}
}
</style>
</head>
<body>
<div class="admin-header">
  <div class="admin-header-inner">
    <div class="admin-title">📊 测评管理后台</div>
    <div class="admin-header-actions">
      <div class="admin-search">
        <span class="admin-search-icon">🔍</span>
        <input id="adminSearchInput" placeholder="搜索学生姓名…" autocomplete="off">
      </div>
      <button class="icon-btn" id="btnRefresh" title="刷新数据">🔄</button>
      <button class="icon-btn" id="btnDemo" title="加载示例数据">🎲</button>
      <button class="icon-btn" id="btnSetup" title="远程设置">⚙️</button>
    </div>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" id="tabList">学生列表</button>
    <button class="admin-tab" id="tabDetail" style="display:none">学生详情</button>
  </div>
</div>

<!-- 远程状态栏 -->
<div class="remote-bar" id="remoteBar"></div>

<!-- 设置面板 -->
<div class="setup-panel" id="setupPanel" style="display:none"></div>

<!-- 主体 -->
<div class="admin-body" id="adminBody"></div>

<script>
// ============================================================
// ===== 远程存储模块 =====
// ============================================================
var RemoteStore = {
  _cfg: null,
  init: function() {
    try {
      var saved = JSON.parse(localStorage.getItem('remoteConfig'));
      if (!saved || !saved.key || !saved.bin) {
        saved = JSON.parse(localStorage.getItem('quiz_rc_admin'));
      }
      if (saved && saved.key && saved.bin) this._cfg = saved;
    } catch(e) {}
  },
  ready: function() { return !!this._cfg; },
  getConfig: function() { return this._cfg; },
  setConfig: function(key, bin, accessKey) {
    this._cfg = { key: key, bin: bin };
    if (accessKey) this._cfg.accessKey = accessKey;
    localStorage.setItem('remoteConfig', JSON.stringify(this._cfg));
  },
  clearConfig: function() {
    this._cfg = null;
    localStorage.removeItem('remoteConfig');
    localStorage.removeItem('quiz_rc_admin');
  },
  getHeaders: function() {
    var h = {};
    if (this._cfg && this._cfg.accessKey) {
      h['X-Access-Key'] = this._cfg.accessKey;
    } else if (this._cfg) {
      h['X-Master-Key'] = this._cfg.key;
    }
    return h;
  },
  loadAll: function() {
    if (!this.ready()) return Promise.resolve([]);
    var url = 'https://api.jsonbin.io/v3/b/' + this._cfg.bin + '/latest';
    var headers = this.getHeaders();
    return fetch(url, { headers: headers })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) { return Array.isArray(data.record) ? data.record : []; })
      .catch(function(err) {
        console.error('[云端读取失败]', err.message);
        window._lastRemoteError = err.message;
        return [];
      });
  },
  makeStudentLink: function() {
    if (!this.ready()) return '';
    var base = window.location.href.replace(/admin\.html.*$/, 'index.html');
    var payload = { k: this._cfg.key, b: this._cfg.bin };
    if (this._cfg.accessKey) payload.a = this._cfg.accessKey;
    var encoded = btoa(JSON.stringify(payload));
    return base + '?rc=' + encodeURIComponent(encoded);
  }
};

// ===== 工具函数 =====
function $(id) { return document.getElementById(id); }
function getLocalResults() { try { return JSON.parse(localStorage.getItem('quiz_results_v2') || '[]'); } catch(e) { return []; } }

// ===== 状态 =====
var currentView = 'list';
var cachedRemoteResults = null;

// ============================================================
// ===== 配置（与学生端一致） =====
// ============================================================
var QUIZ_CONFIG = {
  grade: "一升二",
  subject: "数学思维",
  lessons: [
    { id:1, name:"计算认知", tag:"计算", desc:"从加法到乘法的转换，理解乘法含义" },
    { id:2, name:"几何空间", tag:"几何", desc:"立体图形认知，空间感知，面的观察" },
    { id:3, name:"逻辑比较", tag:"逻辑", desc:"比轻重，有序比较，同增同减" },
    { id:4, name:"组合问题", tag:"应用", desc:"有序思考，两两组合" },
    { id:5, name:"推理思维", tag:"逻辑", desc:"排除推理，根据条件逐步推断" }
  ],
  questions: [
    { lessonId:1, type:"concept", label:"易混淆概念", timeLimit:25, questionType:"choice", text:"2+2+2=6，你觉得下面哪种写法能表示这个式子？", options:["3+3=6","2×3=6","3×2=6","B和C都对"], answer:3, explain:"2+2+2是3个2相加，可以写成2×3=6或3×2=6。两种写法都对！" },
    { lessonId:1, type:"trap", label:"易错题", timeLimit:50, questionType:"input", inputMode:"number", text:"5个3相加后，再加上3个5是多少？", answer:"30", explain:"5个3相加=15，3个5相加=15，合起来15+15=30" },

function showLinkModal() {
  var link = RemoteStore.makeStudentLink();
  if (!link) { alert('请先配置远程存储'); return; }

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-card"><h3>📋 学生测评链接</h3><div class="modal-desc">把这个链接发给学生，答题数据会自动同步到云端。</div><div class="modal-link-box"><textarea class="modal-link-input" readonly id="modalLinkText">' + link + '</textarea><button class="modal-copy-btn" id="modalCopyBtn">复制链接</button></div><button class="modal-close" id="modalCloseBtn">关闭</button></div>';
  document.body.appendChild(overlay);

  setTimeout(function() {
    var textarea = $('modalLinkText');
    if (textarea) { textarea.focus(); textarea.select(); }
  }, 100);

  $('modalCopyBtn').addEventListener('click', function() {
    var textarea = $('modalLinkText');
    if (textarea) {
      textarea.select();
      try {
        document.execCommand('copy');
        $('modalCopyBtn').textContent = '已复制 ✓';
        setTimeout(function() { $('modalCopyBtn').textContent = '复制链接'; }, 2000);
      } catch(e) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(link).then(function() {
            $('modalCopyBtn').textContent = '已复制 ✓';
            setTimeout(function() { $('modalCopyBtn').textContent = '复制链接'; }, 2000);
          });
        }
      }
    }
  });

  $('modalCloseBtn').addEventListener('click', function() { document.body.removeChild(overlay); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
}

// ===== 数据加载与渲染 =====
// ============================================================
function loadAndRender() {
  var keyword = $('adminSearchInput') ? $('adminSearchInput').value.trim() : '';
  if (RemoteStore.ready()) {
    $('adminBody').innerHTML = '<div class="loading-state"><div class="spinner"></div><p>正在从云端加载数据…</p></div>';
    RemoteStore.loadAll().then(function(remoteData) {
      cachedRemoteResults = remoteData;
      var localData = getLocalResults();
      var allData = mergeResults(remoteData, localData);
      // 如果云端返回空且本地也空，且之前有错误，显示错误提示
      if (allData.length === 0 && window._lastRemoteError) {
        $('adminBody').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>云端读取失败: ' + window._lastRemoteError + '</p><p style="font-size:14px;margin-top:8px;color:var(--orange)">请检查 API Key 和 Bin ID 是否正确，或到 jsonbin.io 确认账户状态</p></div>';
        return;
      }
      renderList(allData, keyword);
    });
  } else {
    renderList(getLocalResults(), keyword);
  }
}

function mergeResults(remote, local) {
  var map = {};
  var result = [];
  function add(r) {
    var key = r.name + '_' + r.timestamp;
    if (!map[key]) { map[key] = true; result.push(r); }
  }
  for (var i = 0; i < remote.length; i++) add(remote[i]);
  for (var i = 0; i < local.length; i++) add(local[i]);
  return result;
}

// ===== 管理端渲染 =====
// ============================================================
function renderList(allResults, keyword) {
  var filtered = keyword ? allResults.filter(function(r) {
    return r.name.toLowerCase().indexOf(keyword.toLowerCase()) >= 0;
  }) : allResults.slice();

  filtered.sort(function(a, b) { return b.timestamp - a.timestamp; });

  var totalStudents = allResults.length;
  var avgCorrect = totalStudents > 0 ? (allResults.reduce(function(s, r) { return s + r.correctCount; }, 0) / totalStudents).toFixed(1) : 0;
  var maxCorrect = totalStudents > 0 ? Math.max.apply(null, allResults.map(function(r) { return r.correctCount; })) : 0;
  var avgTime = totalStudents > 0 ? Math.round(allResults.reduce(function(s, r) { return s + r.totalTime; }, 0) / totalStudents) : 0;

  var html = '';
  html += '<div class="admin-stats">';
  html += '<div class="admin-stat-card"><div class="admin-stat-num">' + totalStudents + '</div><div class="admin-stat-label">参测学生</div></div>';
  html += '<div class="admin-stat-card"><div class="admin-stat-num">' + avgCorrect + '</div><div class="admin-stat-label">平均答对</div></div>';
  html += '<div class="admin-stat-card"><div class="admin-stat-num">' + maxCorrect + '/10</div><div class="admin-stat-label">最多答对</div></div>';
  html += '<div class="admin-stat-card"><div class="admin-stat-num">' + avgTime + 's</div><div class="admin-stat-label">平均用时</div></div>';
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">📭</div><p>' + (keyword ? '没有找到"' + keyword + '"的测评记录' : '暂无测评记录') + '</p>';
    if (!keyword && !RemoteStore.ready()) {
      html += '<p style="font-size:14px;margin-top:8px;color:var(--orange)">💡 配置远程存储后，学生答题数据会自动同步到这里</p>';
    }
    html += '</div>';
  } else {
    html += '<div class="student-list">';
    for (var idx = 0; idx < filtered.length; idx++) {
      var r = filtered[idx];
      var initial = r.name.charAt(0);
      var date = new Date(r.timestamp).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      html += '<div class="student-row" data-ts="' + r.timestamp + '" data-name="' + r.name + '">';
      html += '<div class="student-avatar">' + initial + '</div>';
      html += '<div class="student-info"><div class="student-name">' + r.name + '</div><div class="student-meta">' + (r.grade || '一升二') + ' · ' + date + '</div></div>';
      html += '<div><div class="student-correct">答对' + r.correctCount + '/10</div><div class="student-time">用时' + r.totalTime + 's</div></div>';
      html += '</div>';
    }
    html += '</div>';
  }

  $('adminBody').innerHTML = html;

  var rows = document.querySelectorAll('.student-row');
  for (var i = 0; i < rows.length; i++) {
    rows[i].addEventListener('click', function() {
      var ts = parseInt(this.dataset.ts);
      var nm = this.dataset.name;
      var found = null;
      for (var j = 0; j < allResults.length; j++) {
        if (allResults[j].timestamp === ts && allResults[j].name === nm) { found = allResults[j]; break; }
      }
      if (found) renderDetail(found, allResults);
    });
  }
}

// 多维度交叉分析
function getCrossAnalysis(data) {
  var items = [];
  var correctCount = data.correctCount;
  var totalTime = data.totalTime;
  var avgTimePerQ = totalTime / 10;

  // 概念题 vs 挑战题对比
  var conceptCorrect = 0, conceptTotal = 0, trapCorrect = 0, trapTotal = 0;
  for (var i = 0; i < data.answers.length; i++) {
    var a = data.answers[i];
    if (!a) continue;
    var q = QUIZ_CONFIG.questions[i];
    if (q.type === 'concept') { conceptTotal++; if (a.isCorrect) conceptCorrect++; }
    else { trapTotal++; if (a.isCorrect) trapCorrect++; }
  }

  if (conceptCorrect >= 4 && trapCorrect >= 3) {
    items.push({ icon: '🌟', text: '概念理解力和实战应用力都很均衡，说明孩子不仅能理解知识点，还能灵活运用，这是非常难得的综合能力。' });
  } else if (conceptCorrect >= 4 && trapCorrect < 3) {
    items.push({ icon: '💡', text: '孩子的概念理解力不错，但在复杂场景下的应用能力还需要提升。建议在理解的基础上多做变式练习，把知识用活。' });
  } else if (conceptCorrect < 4 && trapCorrect >= 3) {
    items.push({ icon: '💡', text: '孩子在实战中展现了不错的直觉和灵活性，但部分基础概念还需要夯实。建议先回到课本，把每个概念理解透彻。' });
  }

  // 速度维度
  if (avgTimePerQ < 15 && correctCount >= 7) {
    items.push({ icon: '⚡', text: '答题又快又准，说明思维敏捷度高，对知识点的掌握已经达到了自动化水平，继续保持！' });
  } else if (avgTimePerQ > 30 && correctCount >= 6) {
    items.push({ icon: '🐢', text: '答题偏慢但正确率还不错，说明孩子在认真思考，只是需要更多练习来提升熟练度。速度会随着练习自然提高。' });
  } else if (avgTimePerQ < 12 && correctCount < 5) {
    items.push({ icon: '⚠️', text: '答题速度很快但正确率不高，可能存在审题不够仔细的情况。建议养成"读两遍题再动笔"的好习惯。' });
  }

  // 跳过行为分析
  var skipCount = 0;
  for (var i = 0; i < data.answers.length; i++) {
    if (data.answers[i] && data.answers[i].isSkip) skipCount++;
  }
  if (skipCount >= 3) {
    items.push({ icon: '📊', text: '有' + skipCount + '道题选择了跳过，说明在这些知识点上确实比较陌生。这恰恰是值得重点关注的学习方向——跳过不代表学不会，只是需要一个好老师来引导。' });
  } else if (skipCount > 0) {
    items.push({ icon: '📊', text: '有' + skipCount + '道题选择了跳过，这些跳过的题目对应的知识点是孩子当前最需要补齐的短板。' });
  }

  // 模块分布
  var strongModules = [], weakModules = [];
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    var l = QUIZ_CONFIG.lessons[i];
    var ls = data.lessonStats[l.id];
    if (ls.correct >= 2) strongModules.push(l.name);
    else if (ls.correct === 0) weakModules.push(l.name);
  }

  if (strongModules.length >= 3) {
    items.push({ icon: '🏆', text: '在' + strongModules.join('、') + '等多个维度都表现出色，说明数学思维基础比较全面，具备很好的学习潜力。' });
  }
  if (weakModules.length >= 2) {
    items.push({ icon: '🎯', text: '在' + weakModules.join('、') + '方面相对薄弱，这些知识点之间有内在联系，建议系统性地学习而不是逐个击破。' });
  }

  // 综合评价
  if (correctCount >= 8) {
    items.push({ icon: '⭐', text: '综合来看，孩子的数学思维基础非常扎实，具备冲击更高难度题目的能力。建议在巩固基础的同时，适当拓展思维深度。' });
  } else if (correctCount >= 5) {
    items.push({ icon: '⭐', text: '综合来看，孩子已经有了不错的思维基础，但在部分模块还需要针对性加强。如果能有专业老师帮助梳理知识体系，进步会非常快。' });
  } else {
    items.push({ icon: '⭐', text: '综合来看，孩子的数学思维体系还需要系统搭建。这个阶段最重要的是打好基础、建立信心，跟着专业老师一步步来，一定能看到明显的进步。' });
  }

  return items;
}

// 推课话术 - 委婉版
function getSubtleCourseSuggestion(data) {
  var name = data.name;
  var strong = [], weak = [];
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    var l = QUIZ_CONFIG.lessons[i];
    var ls = data.lessonStats[l.id];
    if (ls.correct >= 2) strong.push(l.name);
    else if (ls.correct === 0) weak.push(l.name);
  }

  var text = '从' + name + '的测评结果来看，孩子在' + (strong.length > 0 ? strong.join('、') + '方面已经展现了不错的基础' : '各方面都还有很大的成长空间');
  if (weak.length > 0) {
    text += '，同时在' + weak.join('、') + '方面还有一些知识点没有完全掌握。';
  } else {
    text += '。';
  }
  text += '这些知识点在二年级、三年级的学习中会越来越重要，如果现在能系统地梳理一遍，后续的学习会轻松很多。我们暑期正好有一套思维课程，正好覆盖这些内容，可以先让孩子试听一节课感受下，看看是否喜欢老师的风格。';

  return text;
}

// 推课话术 - 直白版

  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {

// ===== 雷达图 =====
function drawRadar(canvasId, labels, values) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 90;
  var n = labels.length;
  var step = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, W, H);

  for (var lv = 1; lv <= 4; lv++) {
    var r = R * lv / 4;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var angle = i * step - Math.PI / 2;
      var x = cx + r * Math.cos(angle);
      var y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,122,69,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,122,69,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var idx = i % n;
    var angle = idx * step - Math.PI / 2;
    var r = R * (values[idx] / 100);
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,122,69,0.18)';
  ctx.fill();
  ctx.strokeStyle = '#FF7A45';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    var r = R * (values[i] / 100);
    ctx.beginPath();
    ctx.arc(cx + r * Math.cos(angle), cy + r * Math.sin(angle), 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#FF7A45';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    var lx = cx + (R + 34) * Math.cos(angle);
    var ly = cy + (R + 34) * Math.sin(angle);
    var cosA = Math.cos(angle);
    if (Math.abs(cosA) < 0.15) {
      ctx.textAlign = 'center';
    } else if (cosA > 0) {
      ctx.textAlign = 'left';
    } else {
      ctx.textAlign = 'right';
    }
    ctx.fillStyle = '#3D2817';
    ctx.fillText(labels[i], lx, ly - 7);
    ctx.fillStyle = '#FF7A45';
    ctx.font = 'bold 11px "PingFang SC",sans-serif';
    ctx.fillText(values[i] + '%', lx, ly + 9);
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  }
}

  html += '<div class="section"><h2>📊 基础数据</h2>';
  html += '<div class="item">答对：' + data.correctCount + '/10 | 总用时：' + data.totalTime + 's</div>';
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    var l = QUIZ_CONFIG.lessons[i];
    var ls = data.lessonStats[l.id];
    html += '<div class="item">' + l.tag + '·' + l.name + '：答对' + ls.correct + '/2</div>';
  }
  html += '</div>';

  // 逐题
  html += '<div class="section"><h2>📋 逐题详情</h2>';
  for (var i = 0; i < data.answers.length; i++) {
    var a = data.answers[i];
    if (!a) continue;
    var q = QUIZ_CONFIG.questions[i];
    var st = a.isSkip ? '跳过' : a.isCorrect ? '正确' : (a.isTimeout ? '超时' : '错误');
    html += '<div class="item">第' + (i+1) + '题 · ' + q.label + ' · ' + st + ' · 用时' + a.timeUsed + 's<br>📌 ' + q.explain + '</div>';
  }
  html += '</div>';

  html += '<button class="print-btn" onclick="window.print()">🖨️ 打印报告</button>';
  html += '</div></body></html>';

  var blob = new Blob([html], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  var dateStr = new Date(data.timestamp).toLocaleDateString('zh-CN').replace(/\//g, '');
  link.download = data.name + '_深度分析报告_' + dateStr + '.html';
  link.click();
  URL.revokeObjectURL(url);
}

// ===== 示例数据 =====
function generateDemoData() {
  var now = Date.now();
  var lessons = QUIZ_CONFIG.lessons;
  var questions = QUIZ_CONFIG.questions;
  var students = [];

  // 辅助：构造一条答题记录
  function makeAnswer(qi, isCorrect, timeUsed, isSkip, isTimeout) {
    var q = questions[qi];
    var sel = null;
    if (isSkip) { sel = null; }
    else if (q.questionType === 'choice') {
      sel = isCorrect ? q.answer : ((q.answer + 1) % q.options.length);
    } else {
      sel = isCorrect ? q.answer : '99';
    }
    return { qIndex: qi, selected: sel, timeUsed: timeUsed, isCorrect: !!isCorrect, isTimeout: !!isTimeout, isSkip: !!isSkip, lessonId: q.lessonId };
  }

  // 辅助：构造一个学生记录
  function makeStudent(name, answerPattern, baseTime) {
    var answers = [];
    var totalTime = 0;
    var correctCount = 0;
    var lessonStats = {};
    for (var i = 0; i < lessons.length; i++) {
      lessonStats[lessons[i].id] = { name: lessons[i].name, tag: lessons[i].tag, desc: lessons[i].desc, correct: 0, totalTime: 0, questions: [] };
    }
    for (var i = 0; i < 10; i++) {
      var p = answerPattern[i];
      var timeUsed = baseTime + Math.floor(Math.random() * 8) - 3;
      if (timeUsed < 3) timeUsed = 3;
      if (p.skip) { timeUsed = Math.floor(Math.random() * 5) + 2; }
      var a = makeAnswer(i, !!p.correct, timeUsed, !!p.skip, !!p.timeout);
      answers.push(a);
      totalTime += timeUsed;
      if (p.correct) correctCount++;
      var ls = lessonStats[a.lessonId];
      if (p.correct) ls.correct++;
      ls.totalTime += timeUsed;
      ls.questions.push(JSON.parse(JSON.stringify(a)));
    }
    return { name: name, grade: '一升二', subject: '数学思维', timestamp: now - Math.floor(Math.random() * 86400000 * 3), totalTime: totalTime, correctCount: correctCount, lessonStats: lessonStats, answers: answers };
  }

  // 学生1：学霸型 - 9/10
  students.push(makeStudent('王子轩', [
    {correct:1},{correct:1},{correct:1},{correct:1},{correct:1},{correct:1},{correct:1},{correct:1},{correct:0},{correct:1}
  ], 12));

  // 学生2：中上型 - 7/10
  students.push(makeStudent('李思琪', [
    {correct:1},{correct:1},{correct:1},{correct:0},{correct:1},{correct:1},{correct:0},{correct:1},{correct:0},{correct:0}
  ], 16));

  // 学生3：中等型 - 5/10
  students.push(makeStudent('张浩然', [
    {correct:1},{correct:0},{correct:1},{correct:0},{correct:1},{correct:0},{correct:1},{correct:1},{correct:0},{correct:0}
  ], 20));

  // 学生4：中下型 - 3/10
  students.push(makeStudent('赵雨萱', [
    {correct:1},{correct:0},{correct:0},{correct:0},{correct:1},{correct:0},{correct:0},{correct:0},{correct:1},{correct:0}
  ], 25));

  // 学生5：学困型 - 2/10, 有跳过
  students.push(makeStudent('刘一诺', [
    {correct:1},{correct:0},{correct:0},{skip:1},{correct:0},{skip:1},{correct:0},{correct:0},{skip:1},{correct:1}
  ], 22));

  return students;
}

function loadDemoData() {
  var demo = generateDemoData();
  // 保存到 localStorage
  localStorage.setItem('quiz_results_v2', JSON.stringify(demo));
  loadAndRender();
  showToast('已加载 5 条示例数据', 'success');
}

function showToast(msg, type) {
  var el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.12);transition:all .4s;opacity:1;' + (type === 'success' ? 'background:#E8F5EC;color:#4A9B6E' : 'background:#FFF4D6;color:#B88600');
  document.body.appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { document.body.removeChild(el); }, 500); }, 2500);
}

// ===== 初始化 =====
window.addEventListener('DOMContentLoaded', function() {
  try {
    RemoteStore.init();
    renderRemoteBar();
    loadAndRender();

    if ($('adminSearchInput')) $('adminSearchInput').addEventListener('input', function(e) {
      var allData = RemoteStore.ready() ? (cachedRemoteResults || []) : getLocalResults();
      if (RemoteStore.ready() && cachedRemoteResults) {
        allData = mergeResults(cachedRemoteResults, getLocalResults());
      }
      renderList(allData, e.target.value.trim());
    });

    if ($('tabList')) $('tabList').addEventListener('click', function() {
      currentView = 'list';
      $('tabList').classList.add('active');
      $('tabDetail').classList.remove('active');
      $('tabDetail').style.display = 'none';
      $('tabList').style.display = '';
      loadAndRender();
    });

    if ($('btnRefresh')) $('btnRefresh').addEventListener('click', function() {
      loadAndRender();
    });

    if ($('btnSetup')) $('btnSetup').addEventListener('click', function() {
      toggleSetup();
    });

    if ($('btnDemo')) $('btnDemo').addEventListener('click', function() {
      try {
        var demo = generateDemoData();
        localStorage.setItem('quiz_results_v2', JSON.stringify(demo));
        loadAndRender();
        showToast('已加载 5 条示例数据', 'success');
      } catch(e) {
        alert('加载示例数据失败: ' + e.message);
      }
    });
  } catch(e) {
    console.error('初始化失败:', e.message);
  }
});
</script>
