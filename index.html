<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一升二数学思维挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","HarmonyOS Sans SC",-apple-system,sans-serif;background:#FFF8E7;color:#3D2817;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}
:root{--orange:#FF7A45;--orange-light:#FF9F66;--yellow:#FFC93C;--cream:#FFF8E7;--cream-deep:#FCEFD5;--red:#E84855;--green:#7BC4A4;--green-deep:#4A9B6E;--brown:#3D2817;--brown-light:#5D3A1A;--shadow:0 4px 16px rgba(255,122,69,.12);--shadow-hover:0 8px 24px rgba(255,122,69,.25)}
.page{display:none;min-height:100vh;padding-bottom:40px}
.page.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== 入口页 ===== */
.entry-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.entry-icon{width:80px;height:80px;margin:0 auto 16px;animation:bounce 2s ease-in-out infinite}
.entry-icon img{width:100%;height:100%;object-fit:contain}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.entry-title{font-size:28px;font-weight:800;color:var(--brown);margin-bottom:8px}
.entry-desc{font-size:17px;color:#8B8680;margin-bottom:32px;max-width:320px;line-height:1.7}
.entry-card{background:white;border-radius:24px;padding:28px 24px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.entry-label{font-size:16px;font-weight:700;color:var(--brown);margin-bottom:8px;text-align:left}
.entry-input{width:100%;border:2px solid var(--cream-deep);border-radius:14px;padding:14px 16px;font-size:18px;outline:none;transition:all .2s;background:var(--cream)}
.entry-input:focus{border-color:var(--orange);background:white}
.entry-btn{width:100%;margin-top:20px;padding:16px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border-radius:18px;font-size:20px;font-weight:800;box-shadow:var(--shadow-hover);transition:all .2s}
.entry-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,122,69,.35)}
.entry-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.entry-rules{margin-top:16px;background:var(--cream-deep);border-radius:14px;padding:14px 16px;text-align:left;font-size:14px;color:var(--brown-light);line-height:1.7}
.entry-rules b{color:var(--orange)}

/* ===== 答题页 ===== */
.quiz-header{position:sticky;top:0;z-index:50;background:rgba(255,248,231,.95);backdrop-filter:blur(8px);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto}
.quiz-progress-text{font-size:14px;font-weight:700;color:var(--brown)}
.quiz-timer{font-size:32px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.quiz-timer.warning{color:var(--red);animation:pulse .5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.quiz-progress-bar{height:6px;background:var(--cream-deep);border-radius:100px;margin:0 20px 16px;max-width:680px;margin-left:auto;margin-right:auto;overflow:hidden}
.quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:100px;transition:width .3s ease}
.question-card{background:white;border-radius:24px;padding:28px 24px;margin:16px 20px;max-width:680px;margin-left:auto;margin-right:auto;box-shadow:var(--shadow)}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:13px;font-weight:700;margin-bottom:14px}
.q-badge.concept{background:#FFF4D6;color:#B88600}
.q-badge.trap{background:#FCE8EA;color:var(--red)}
.q-badge-num{background:var(--orange);color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.q-lesson{font-size:13px;color:#8B8680;margin-bottom:8px;font-weight:600}
.q-text{font-size:20px;font-weight:700;color:var(--brown);line-height:1.7;margin-bottom:20px}
.q-options{display:flex;flex-direction:column;gap:10px}
.q-option{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--cream);border:2px solid transparent;border-radius:16px;font-size:17px;cursor:pointer;transition:all .2s;text-align:left}
.q-option:hover{border-color:var(--orange);background:white}
.q-option.selected{border-color:var(--orange);background:#FFF0E8}
.q-option-letter{width:32px;height:32px;border-radius:50%;background:var(--cream-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--brown);flex-shrink:0;transition:all .2s}
.q-option.selected .q-option-letter{background:var(--orange);color:white}
.q-input-area{margin-top:8px}
.q-input{width:100%;border:2px solid var(--cream-deep);border-radius:14px;padding:14px 16px;font-size:17px;outline:none;background:var(--cream);transition:all .2s;resize:none;min-height:60px}
.q-input:focus{border-color:var(--orange);background:white}
.q-input-hint{font-size:13px;color:#8B8680;margin-top:6px}
.q-nav-row{max-width:680px;margin:12px auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-back-btn{padding:12px 24px;background:white;color:var(--brown);border:2px solid var(--cream-deep);border-radius:18px;font-size:16px;font-weight:700;transition:all .2s}
.q-back-btn:hover{border-color:var(--orange);background:#FFF0E8}
.q-skip-btn{padding:12px 20px;background:#FFF4D6;color:#B88600;border-radius:18px;font-size:15px;font-weight:700;transition:all .2s;border:2px solid transparent}
.q-skip-btn:hover{border-color:#B88600}
.q-submit-row{max-width:680px;margin:12px auto;padding:0 20px;display:flex;justify-content:flex-end}
.q-submit-btn{padding:14px 36px;background:linear-gradient(135deg,var(--orange),var(--orange-light));color:white;border-radius:18px;font-size:18px;font-weight:800;box-shadow:var(--shadow);transition:all .2s}
.q-submit-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.q-submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* 骰子SVG */
.dice-svg-wrap{display:flex;justify-content:center;margin:12px 0 16px}

/* ===== 远程状态提示 ===== */
.sync-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;z-index:200;transition:all .4s ease;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.sync-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync-toast.success{background:#E8F5EC;color:var(--green-deep)}
.sync-toast.error{background:#FCE8EA;color:var(--red)}
.sync-toast.info{background:#FFF4D6;color:#B88600}
.sync-badge{position:fixed;top:14px;right:14px;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:700;z-index:100;background:white;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sync-badge .dot{width:8px;height:8px;border-radius:50%}
.sync-badge .dot.online{background:var(--green)}
.sync-badge .dot.offline{background:var(--red)}

/* ===== 结果页 ===== */
.result-wrap{max-width:720px;margin:0 auto;padding:20px}
.result-header{text-align:center;padding:24px 0 16px}
.result-header h1{font-size:24px;font-weight:800;color:var(--brown)}
.result-header p{font-size:15px;color:#8B8680;margin-top:4px}
.verdict-box{background:white;border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px;text-align:center}
.verdict-text{font-size:17px;color:var(--brown);line-height:1.8;font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:white;border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--orange)}
.stat-label{font-size:12px;color:#8B8680;margin-top:2px}
.radar-wrap{background:white;border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.radar-wrap h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.radar-subtitle{font-size:13px;color:#8B8680;margin-bottom:12px;padding-left:2px}
.radar-canvas-wrap{display:flex;justify-content:center}
canvas.radar-chart{max-width:400px;max-height:400px}
.time-bar-wrap{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.time-bar-wrap h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.time-bar-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.time-bar-label{width:60px;font-size:13px;font-weight:600;color:var(--brown);flex-shrink:0;text-align:right}
.time-bar-track{flex:1;height:16px;background:var(--cream-deep);border-radius:100px;overflow:hidden}
.time-bar-fill{height:100%;border-radius:100px;transition:width 1s ease;font-size:10px;font-weight:700;color:white;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:24px}
.time-bar-fill.fast{background:linear-gradient(90deg,var(--green),#5DD4A0)}
.time-bar-fill.normal{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.time-bar-fill.slow{background:linear-gradient(90deg,var(--red),#F06868)}
.time-bar-limit{font-size:11px;color:#8B8680;width:30px;text-align:left}
.detail-section{background:white;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.detail-section h3{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.detail-item{padding:12px 0;border-bottom:1px solid var(--cream-deep);display:flex;gap:12px;align-items:flex-start}
.detail-item:last-child{border-bottom:none}
.detail-body{flex:1;min-width:0}
.detail-q{font-size:15px;font-weight:600;color:var(--brown);margin-bottom:4px}
.detail-meta{font-size:13px;color:#8B8680;display:flex;gap:10px;flex-wrap:wrap}
.detail-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.detail-tag.concept{background:#FFF4D6;color:#B88600}
.detail-tag.trap{background:#FCE8EA;color:var(--red)}
.conclusion-section{background:linear-gradient(135deg,#FFF0E8,#FFF8E7);border-radius:24px;padding:24px;margin-bottom:16px;border:2px solid var(--cream-deep)}
.conclusion-section h3{font-size:18px;font-weight:800;color:var(--orange);margin-bottom:12px}
.conclusion-text{font-size:16px;color:var(--brown);line-height:1.8}
.conclusion-cta{margin-top:16px;padding:14px;background:white;border-radius:14px;font-size:15px;color:var(--brown);line-height:1.7;font-weight:600}

@media(max-width:600px){
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

var RemoteStore = {
  _cfg: null,
  init: function() {
    var search = window.location.search || '';
    var match = search.match(/[?&]rc=([^&]+)/);
    if (match) {
      try {
        var decoded = JSON.parse(atob(decodeURIComponent(match[1])));
        if (decoded.k && decoded.b) {
          this._cfg = { key: decoded.k, bin: decoded.b };
          localStorage.setItem('quiz_rc', JSON.stringify(this._cfg));
        }
      } catch(e) {}
    }
    if (!this._cfg) {
      try {
        var saved = JSON.parse(localStorage.getItem('quiz_rc'));
        if (saved && saved.key && saved.bin) this._cfg = saved;
      } catch(e) {}
    }
    this._updateBadge();
  },
  ready: function() { return !!this._cfg; },
  _updateBadge: function() {
    // 学生端不显示同步状态（管理端有独立状态栏）
    return;
  },
  save: function(result) {
    if (!this.ready()) return Promise.resolve(false);
    var self = this;
    var url = 'https://api.jsonbin.io/v3/b/' + this._cfg.bin + '/latest';
    return fetch(url, { headers: { 'X-Master-Key': this._cfg.key } })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var records = Array.isArray(data.record) ? data.record : [];
        records.push(result);
        return fetch('https://api.jsonbin.io/v3/b/' + self._cfg.bin, {
          method: 'PUT',
          headers: { 'X-Master-Key': self._cfg.key, 'Content-Type': 'application/json' },
          body: JSON.stringify(records)
        });
      })
      .then(function(r) { return r.ok; })
      .catch(function() { return false; });
  }
};

  setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ===== 答题 =====
function renderQuestion() {
  var q = QUIZ_CONFIG.questions[state.currentQ];
  var idx = state.currentQ;
  var total = QUIZ_CONFIG.questions.length;
  var lesson = null;
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    if (QUIZ_CONFIG.lessons[i].id === q.lessonId) { lesson = QUIZ_CONFIG.lessons[i]; break; }
  }

  $('quizProgressText').textContent = '第 ' + (idx+1) + '/' + total + ' 题';
  $('quizProgressFill').style.width = ((idx/total)*100) + '%';

  // 返回按钮
  $('backBtn').style.display = idx > 0 ? '' : 'none';

  // 如果这题已经提交过，显示已作答状态
  var alreadyAnswered = state.submitted[idx];

  var letters = ['A','B','C','D'];
  var inputHtml = '';

  if (q.questionType === 'choice') {
    inputHtml = '<div class="q-options">';
    for (var i = 0; i < q.options.length; i++) {
      var selClass = '';
      if (alreadyAnswered && state.answers[idx] !== null && state.answers[idx].selected === i) {
        selClass = ' selected';
      }
      inputHtml += '<div class="q-option' + selClass + '" data-idx="' + i + '"><span class="q-option-letter">' + letters[i] + '</span><span>' + q.options[i] + '</span></div>';
    }
    inputHtml += '</div>';
  } else {
    var inputType = q.inputMode === 'number' ? 'tel' : 'text';
    var savedVal = '';
    if (alreadyAnswered && state.answers[idx] !== null && typeof state.answers[idx].selected === 'string') {
      savedVal = state.answers[idx].selected;
    }
    var inputMode = q.inputMode === 'number' ? ' inputmode="numeric" pattern="[0-9]*"' : '';
    inputHtml = '<div class="q-input-area"><input class="q-input" id="answerInput" type="' + inputType + '"' + inputMode + ' placeholder="写下你的答案" value="' + savedVal + '">' + '<div class="q-input-hint">💡 仔细想一想，写清楚你的答案</div></div>';
  }

  // 骰子图
  var diceHtml = '';
  if (q.diceImage) {
    diceHtml = '<div class="dice-svg-wrap">' + DICE_SVG + '</div>';
  }

  $('questionArea').innerHTML = '<div class="question-card">'
    + '<div class="q-badge ' + q.type + '"><span class="q-badge-num">' + q.lessonId + '</span>' + q.label + ' · ' + q.timeLimit + 's</div>'
    + '<div class="q-lesson">模块' + q.lessonId + '：' + lesson.name + '</div>'
    + '<div class="q-text">' + q.text.replace(/\n/g,'<br>') + '</div>'
    + diceHtml
    + inputHtml
    + '</div>';

  // 如果已经作答，允许修改答案，同时提供下一题按钮
  if (alreadyAnswered) {
    $('submitAnswerBtn').textContent = '修改并提交';
    $('submitAnswerBtn').disabled = false;
    $('skipBtn').style.display = 'none';
    // 回看时显示剩余时间
    var prevAnswer = state.answers[idx];
    state.timeLeft = 0; // 不计时
    $('quizTimer').textContent = '已作答';
  } else {
    $('submitAnswerBtn').textContent = '确认提交';
    $('submitAnswerBtn').disabled = true;
    $('skipBtn').style.display = '';
  }

  state.questionStartTime = Date.now();
  if (!alreadyAnswered) {
    state.timeLeft = q.timeLimit;
    updateTimer();
    startTimer();
  } else {
    clearInterval(state.timerInterval);
  }

  // 下一题按钮（回看时显示）
  var existingNextBtn = document.getElementById('nextBtn');
  if (existingNextBtn) existingNextBtn.remove();
  if (alreadyAnswered && idx < QUIZ_CONFIG.questions.length - 1) {
    var nextBtn = document.createElement('button');
    nextBtn.className = 'q-skip-btn';
    nextBtn.id = 'nextBtn';
    nextBtn.textContent = '下一题 →';
    nextBtn.style.marginLeft = '8px';
    document.querySelector('.q-nav-row').appendChild(nextBtn);
    nextBtn.addEventListener('click', function() {
      state.currentQ++;
      renderQuestion();
    });
  }

  if (q.questionType === 'choice') {
    var opts = document.querySelectorAll('.q-option');
    for (var i = 0; i < opts.length; i++) {
      opts[i].addEventListener('click', function() {
        var all = document.querySelectorAll('.q-option');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('selected');
        this.classList.add('selected');
        $('submitAnswerBtn').disabled = false;
      });
    }
  } else {
    var inp = $('answerInput');
    if (inp) {
      // 限制只能输入数字
      if (q.inputMode === 'number') {
        inp.addEventListener('input', function() {
          inp.value = inp.value.replace(/[^0-9]/g, '');
          $('submitAnswerBtn').disabled = !inp.value.trim();
        });
      } else {
        inp.addEventListener('input', function() {
          $('submitAnswerBtn').disabled = !inp.value.trim();
        });
      }
      if (!alreadyAnswered) inp.focus();
    }
  }
}

function startTimer() {
  clearInterval(state.timerInterval);
  if (state.submitted[state.currentQ]) {
    $('quizTimer').textContent = '--';
    return;
  }
  state.timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - state.questionStartTime) / 1000);
    var q = QUIZ_CONFIG.questions[state.currentQ];
    state.timeLeft = Math.max(0, q.timeLimit - elapsed);
    updateTimer();
    if (state.timeLeft <= 0) { clearInterval(state.timerInterval); submitAnswer(true); }
  }, 100);
}

function updateTimer() {
  var el = $('quizTimer');
  el.textContent = state.timeLeft + 's';
  if (state.timeLeft <= 5) el.classList.add('warning');
  else el.classList.remove('warning');
}

function submitAnswer(isTimeout) {
  clearInterval(state.timerInterval);
  var q = QUIZ_CONFIG.questions[state.currentQ];
  var wasAlreadyAnswered = state.submitted[state.currentQ];
  var timeUsed = Math.min(Math.floor((Date.now() - state.questionStartTime) / 1000), q.timeLimit);

  // 如果是回看后修改答案，保留原始用时
  if (wasAlreadyAnswered && state.answers[state.currentQ]) {
    timeUsed = state.answers[state.currentQ].timeUsed;
  }

  var selected, isCorrect;
  if (q.questionType === 'choice') {
    var selEl = document.querySelector('.q-option.selected');
    selected = selEl ? parseInt(selEl.dataset.idx) : -1;
    isCorrect = !isTimeout && selected === q.answer;
  } else {
    var inp = $('answerInput');
    selected = inp ? inp.value.trim() : '';
    var accepts = q.acceptAnswers || [q.answer];
    isCorrect = false;
    for (var i = 0; i < accepts.length; i++) {
      if (accepts[i].toLowerCase().replace(/\s/g,'') === selected.toLowerCase().replace(/\s/g,'')) {
        isCorrect = true; break;
      }
    }
    if (isTimeout) isCorrect = false;
  }

  state.answers[state.currentQ] = {
    qIndex: state.currentQ,
    selected: selected,
    timeUsed: timeUsed,
    isCorrect: isCorrect,
    isTimeout: isTimeout,
    lessonId: q.lessonId
  };
  state.submitted[state.currentQ] = true;

  // 自动进入下一题
  if (state.currentQ < QUIZ_CONFIG.questions.length - 1) {
    state.currentQ++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function goBack() {
  if (state.currentQ > 0) {
    clearInterval(state.timerInterval);
    state.currentQ--;
    renderQuestion();
  }
}

function skipQuestion() {
  clearInterval(state.timerInterval);
  var q = QUIZ_CONFIG.questions[state.currentQ];
  var timeUsed = Math.floor((Date.now() - state.questionStartTime) / 1000);

  state.answers[state.currentQ] = {
    qIndex: state.currentQ,
    selected: null,
    timeUsed: timeUsed,
    isCorrect: false,
    isTimeout: false,
    isSkip: true,
    lessonId: q.lessonId
  };
  state.submitted[state.currentQ] = true;

  if (state.currentQ < QUIZ_CONFIG.questions.length - 1) {
    state.currentQ++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

// ===== 完成 =====
function finishQuiz() {
  var totalTime = 0, correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i]) {
      totalTime += state.answers[i].timeUsed;
      if (state.answers[i].isCorrect) correctCount++;
    }
  }

  var lessonStats = {};
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    var l = QUIZ_CONFIG.lessons[i];
    lessonStats[l.id] = { name: l.name, tag: l.tag, desc: l.desc, correct: 0, totalTime: 0, questions: [] };
  }
  for (var i = 0; i < state.answers.length; i++) {
    var a = state.answers[i];
    if (!a) continue;
    var q = QUIZ_CONFIG.questions[i];
    var ls = lessonStats[a.lessonId];
    if (a.isCorrect) ls.correct++;
    ls.totalTime += a.timeUsed;
    ls.questions.push(JSON.parse(JSON.stringify(a)));
  }

  var resultData = {
    name: state.studentName,
    grade: QUIZ_CONFIG.grade,
    subject: QUIZ_CONFIG.subject,
    timestamp: Date.now(),
    totalTime: totalTime,
    correctCount: correctCount,
    lessonStats: lessonStats,
    answers: state.answers
  };

  saveResultLocal(resultData);
  // 标记已完成测评，下次打开直接显示结果
  localStorage.setItem('quiz_completed_v2', JSON.stringify(resultData));

  if (RemoteStore.ready()) {
    showToast('正在同步到云端...', 'info');
    RemoteStore.save(resultData).then(function(ok) {
      if (ok) showToast('✓ 已成功同步到云端', 'success');
      else showToast('同步失败，数据已保存到本地', 'error');
    });
  }

  showPage('page-result');
  renderResult(resultData);
}

function getRandomConclusion(data) {
  // 分析强项和弱项
  var strong = [], weak = [];
  for (var i = 0; i < QUIZ_CONFIG.lessons.length; i++) {
    var l = QUIZ_CONFIG.lessons[i];
    var ls = data.lessonStats[l.id];
    if (ls.correct >= 2) strong.push(l.name);
    else if (ls.correct === 0) weak.push(l.name);
  }
  if (strong.length === 0) strong = ['逻辑思考'];
  if (weak.length === 0) weak = ['组合应用'];

  var methods = ['乘法转换、空间想象、有序比较、系统推理', '从加法到乘法的思维跳跃、空间观察力、逻辑推理链', '有序思考、排除法、对比分析法'];

  var modules = '计算认知、几何空间、逻辑比较、组合问题、推理思维';

  var template = CONCLUSION_TEMPLATES[Math.floor(Math.random() * CONCLUSION_TEMPLATES.length)];
  template = template.replace(/\{strong\}/g, strong.join('、'));
  template = template.replace(/\{weak\}/g, weak.join('、'));
  template = template.replace(/\{method\}/g, methods[Math.floor(Math.random() * methods.length)]);
  template = template.replace(/\{modules\}/g, modules);
  return template;
}

    radarValues.push(Math.max(0, Math.min(100, Math.round((ls.correct / 2) * 100))));

  for (var i = 0; i < radarValues.length; i++) avgMastery += radarValues[i];

      yourAns = a.selected || '未作答';
    }
    var correctAns = q.questionType === 'choice' ? ['A','B','C','D'][q.answer] : q.answer;
    html += '<div class="detail-item"><div class="detail-body"><div class="detail-q">第' + (i+1) + '题 · ' + q.label + '</div><div class="detail-meta"><span class="detail-tag ' + q.type + '">' + (q.type === 'concept' ? '概念' : '挑战') + '</span><span>你的答案：' + yourAns + '</span><span>正确答案：' + correctAns + '</span><span>用时' + a.timeUsed + 's</span></div>';
    html += '</div></div>';
  }
  html += '</div>';

  // 总评模块
  var conclusion = getRandomConclusion(data);
  html += '<div class="conclusion-section"><h3>📝 总评</h3><div class="conclusion-text">' + conclusion + '</div><div class="conclusion-cta">📸 记得截图发给途途老师，获取专属的深度分析指导哦！</div></div>';

  $('resultContent').innerHTML = html;

  setTimeout(function() { drawRadar('radarCanvas', radarLabels, radarValues); }, 200);
}

// ===== 雷达图 =====
function drawRadar(canvasId, labels, values) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 90;
  var n = labels.length;
  var step = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, W, H);

  for (var lv = 1; lv <= 4; lv++) {
    var r = R * lv / 4;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var angle = i * step - Math.PI / 2;
      var x = cx + r * Math.cos(angle);
      var y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,122,69,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = 'rgba(255,122,69,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var idx = i % n;
    var angle = idx * step - Math.PI / 2;
    var r = R * (values[idx] / 100);
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,122,69,0.18)';
  ctx.fill();
  ctx.strokeStyle = '#FF7A45';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    var r = R * (values[i] / 100);
    ctx.beginPath();
    ctx.arc(cx + r * Math.cos(angle), cy + r * Math.sin(angle), 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#FF7A45';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var angle = i * step - Math.PI / 2;
    var lx = cx + (R + 34) * Math.cos(angle);
    var ly = cy + (R + 34) * Math.sin(angle);
    var cosA = Math.cos(angle);
    if (Math.abs(cosA) < 0.15) {
      ctx.textAlign = 'center';
    } else if (cosA > 0) {
      ctx.textAlign = 'left';
    } else {
      ctx.textAlign = 'right';
    }
    ctx.fillStyle = '#3D2817';
    ctx.fillText(labels[i], lx, ly - 7);
    ctx.fillStyle = '#FF7A45';
    ctx.font = 'bold 11px "PingFang SC",sans-serif';
    ctx.fillText(values[i] + '%', lx, ly + 9);
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  }
}
